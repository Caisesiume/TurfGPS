# gates.yml — every gate the change owes, on every pull request and on every
# push to main (#108).
#
# The gate set is `scripts/team/gates.sh`, run with --all. The script decides
# what runs from what exists — documentation gates always, a stack's gates once
# its manifest does — runs the Go gates from `service/` (`Architecture.md § D8`),
# and prints a result in which every field is derived from its gate's exit
# status. Nothing here names a gate command, so there is no second copy to go
# stale; nothing here writes a result: the job's conclusion is the script's
# exit status, and the summary is its output copied verbatim.
# On a pull request the tree it measures is the head merged into main —
# GitHub's merge ref — so `head:` in the result names that merge commit.
#
# This runner carries what the reference host lacks — a C compiler, so the race
# detector runs, and a container runtime, so the image test runs — and a gate
# the script could not run is `incomplete` (exit 3): red here, never a pass.
#
# The `migrations` job (#153) executes the migrations rather than arguing them:
# `scripts/db/migrate-verify.sh` applies `migrations/[0-9]*.sql` in order to a
# throwaway PostGIS service container, runs each `*.verify.sql` part by part,
# runs each `*.down.sql` twice to observe its exit status, and shows any
# EXPLAIN output in a step of its own. A part that cannot reach its condition is
# `unreached` and the run `incomplete` (exit 3) — red, as above. Before that it proves itself on a
# fixture under `scripts/db/tests/fixtures/` — one that must pass and one with
# planted failures that must be reported as failures. With no `migrations/` in
# the tree it applies nothing and says so. After it, one step runs the Go tests
# that need the schema — `internal/zonestore`'s, built under the `postgis` tag
# (#27), and `internal/syncstore`'s write path (#38, #39) — against a scratch
# database migrated in the same container. go test's exit status is the step's;
# a skip in that run is red as well, because syncstore's test skips wherever no
# copy is named. The container is the job's and is
# discarded with it; nothing durable is provisioned and nothing touches
# `deploy/`.
#
# The `valhalla` job (#6) runs the Valhalla adapter's integration tests against
# a real Valhalla — the Owner's decision on #6 (`#issuecomment-6334699894`), so
# that a wrong assumption about the engine surfaces here and not on the server.
# It builds tiles from the OpenStreetMap extract committed under
# `service/internal/valhalla/testdata/` (whose README says what it holds and
# how to regenerate it), serves them on loopback, and runs
# `internal/valhalla`'s tests under the `valhalla` tag with the race detector.
# A skip in that run is red, as in the schema step above. It runs on every push
# to main, and on a pull request whose diff touches routing — the adapter, the
# planner's port, the routing configuration, the composition root, the
# module's dependencies, or this file; on any other it does nothing and says so.
#
# Supply chain: every action is pinned to a full commit SHA, and the PostGIS
# and Valhalla images to a digest, with each version beside it; each job may
# read the repository and nothing else; no secret is used — the database
# password is the throwaway container's own, set here. Making `gates` and
# `migrations` required status checks is branch protection, which the Owner
# sets.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: service/go.mod
          cache-dependency-path: |
            service/go.mod
            service/go.sum

      # Installs the linter the lint gate calls; it runs nothing itself.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      # The script's exit status is the step's, and so the job's: 0 pass,
      # 1 a gate failed, 3 incomplete, 2 cannot run. Its output is the summary.
      - name: gates.sh --all
        run: |
          rc=0
          bash scripts/team/gates.sh --all > "$RUNNER_TEMP/gates.yml" || rc=$?
          cat "$RUNNER_TEMP/gates.yml"
          { echo '```yaml'; cat "$RUNNER_TEMP/gates.yml"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Each gate's own output, from the directory the result names, so a red
      # run is readable here and a green one shows what each gate did.
      - name: gate logs
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/gates.yml" ] || exit 0
          dir="$(sed -n 's/^  logs: //p' "$RUNNER_TEMP/gates.yml")"
          [ -n "$dir" ] && [ -d "$dir" ] || exit 0
          for f in "$dir"/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f" .log)"
            cat "$f"
            echo "::endgroup::"
          done

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgis:
        # The test instance's version, not production's: that is unchosen
        # (`Architecture.md § What is unproven`, item 3).
        image: postgis/postgis@sha256:eeead53aa76f9219eac3af490e00484a7dd604dbcbc3ed2ae0e96668986f16f3 # 17-3.6
        env:
          POSTGRES_PASSWORD: throwaway-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: throwaway-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two fixture migrations applied in order, every verify part passing, both
      # rollbacks run twice. The script's exit status is the step's.
      - name: fixture — apply, verify, roll back
        run: |
          rc=0
          bash scripts/db/migrate-verify.sh scripts/db/tests/fixtures/pass > "$RUNNER_TEMP/mv-fixture.yml" || rc=$?
          cat "$RUNNER_TEMP/mv-fixture.yml"
          exit "$rc"

      # The runner must be able to say no. The planted fixture holds a failing
      # part, an unreachable part and a migration that does not apply; the step
      # fails unless the result reports each of them as such and exits 1.
      - name: fixture — planted failures are reported as failures
        run: |
          out="$RUNNER_TEMP/mv-planted.yml"
          rc=0
          bash scripts/db/migrate-verify.sh scripts/db/tests/fixtures/planted > "$out" || rc=$?
          cat "$out"
          bad=0
          [ "$rc" -eq 1 ] || { echo "::error::the planted fixture exited $rc, not 1"; bad=1; }
          for want in \
            '{part: A, result: pass}' \
            '{part: B, result: fail, exit: 3, error: "0001_planted.verify.sql:' \
            '{part: C, result: unreached, says: "0001_planted.verify.sql:' \
            'apply: {result: fail, exit: 3, error: "0002_planted.sql:' \
            'apply: not run — an earlier apply failed' \
            'run1: {exit: 0, dropped: [public.planted_point, public.planted_point_pkey]}, run2: {exit: 0, dropped: []}' \
            '  residue: none' \
            '  result: fail'; do
            grep -qF -- "$want" "$out" || { echo "::error::the planted result lacks: $want"; bad=1; }
          done
          exit "$bad"

      - name: migrations/
        run: |
          if [ ! -d migrations ]; then
            echo '::notice title=migrations::no migrations/ in this tree — nothing applied, verified or rolled back'
            exit 0
          fi
          rc=0
          bash scripts/db/migrate-verify.sh migrations > "$RUNNER_TEMP/mv-migrations.yml" || rc=$?
          cat "$RUNNER_TEMP/mv-migrations.yml"
          { echo '```yaml'; cat "$RUNNER_TEMP/mv-migrations.yml"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The Go tests that need the schema, executed against it rather than
      # argued: `internal/zonestore`'s, built under the `postgis` tag (#27) —
      # today `FR-023` AC1, the corridor query and the pool it runs under — and
      # `internal/syncstore`'s write path (#38, #39). A scratch database in
      # this job's container gets `migrations/` applied by psql, the tests run
      # against it with the race detector, and it is dropped. Both packages
      # write `zone` and refuse a copy that already holds rows, so they run one
      # at a time (-p 1); each empties what it wrote. Both steps run whatever
      # the step above concluded: the scratch database is one the rollbacks
      # above never touch.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() }}
        with:
          go-version-file: service/go.mod
          cache-dependency-path: |
            service/go.mod
            service/go.sum

      # go test's exit status is the step's (the job's shell runs with
      # pipefail). syncstore's test skips wherever TURFGPS_TEST_DATABASE_URL is
      # unset where the tagged tests fail, so a skip in the run is red too.
      - name: Go tests against the migrated schema
        if: ${{ !cancelled() }}
        run: |
          db=turfgps_postgis_tests
          pkgs=(./internal/zonestore ./internal/syncstore)
          psql -v ON_ERROR_STOP=1 -q -d postgres -c "CREATE DATABASE \"$db\" TEMPLATE template0"
          trap 'psql -q -d postgres -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)"' EXIT
          find migrations -maxdepth 1 -type f -name '[0-9]*.sql' ! -name '*.verify.sql' ! -name '*.down.sql' | sort |
            while IFS= read -r f; do psql -v ON_ERROR_STOP=1 -q -d "$db" -f "$f"; done
          cd service
          go vet -tags postgis "${pkgs[@]}"
          log="$RUNNER_TEMP/schema-tests.log"
          TURFGPS_TEST_DATABASE_URL="postgres://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/$db?sslmode=disable" \
            go test -tags postgis -race -count=1 -p 1 -v "${pkgs[@]}" 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then echo '::error::a test skipped against the migrated schema, so it measured nothing'; exit 1; fi

      # Any part whose output carried a query plan, from the logs directory
      # each result names — the EXPLAIN (ANALYZE, BUFFERS) evidence.
      - name: EXPLAIN output
        if: always()
        run: |
          for res in "$RUNNER_TEMP"/mv-*.yml; do
            [ -f "$res" ] || continue
            dir="$(sed -n 's/^  logs: //p' "$res")"
            [ -n "$dir" ] && [ -d "$dir" ] || continue
            for f in "$dir"/*.explain; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$res" .yml) — $(basename "$f" .explain)"
              cat "$f"
              echo "::endgroup::"
            done
          done

      # Every step's own output: each apply, verify part and rollback run.
      - name: step logs
        if: always()
        run: |
          for res in "$RUNNER_TEMP"/mv-*.yml; do
            [ -f "$res" ] || continue
            dir="$(sed -n 's/^  logs: //p' "$res")"
            [ -n "$dir" ] && [ -d "$dir" ] || continue
            for f in "$dir"/*.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$res" .yml) — $(basename "$f" .log)"
              cat "$f"
              echo "::endgroup::"
            done
          done

  valhalla:
    name: valhalla
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Valhalla 3.9.1's multi-arch index. The adapter cites this version's
      # route API reference for every field it sends and reads.
      VALHALLA_IMAGE: ghcr.io/valhalla/valhalla@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de # 3.9.1
      EXTRACT: service/internal/valhalla/testdata/goteborg-inom-vallgraven.osm.pbf
    steps:
      # Two commits deep: on a pull request the checkout is GitHub's merge
      # commit, whose first parent is main as the head was merged into it, so
      # the diff between them is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Whether this run owes the engine. A diff that cannot be read is red,
      # never a reason to skip.
      - name: does the change touch routing?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "routing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)" || { echo '::error::cannot read the pull request diff against its base'; exit 1; }
          if printf '%s\n' "$changed" | grep -qE '^(service/internal/(valhalla|planner)/|service/internal/config/valhalla|service/cmd/turfgps/|service/go\.(mod|sum)$|\.github/workflows/gates\.yml$)'; then
            echo "routing=true" >> "$GITHUB_OUTPUT"
          else
            echo "routing=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=valhalla::this change touches no routing path — no engine built, no integration test run'
          fi

      # Tiles from the extract, in a scratch directory the containers mount.
      # Built without an admin or time-zone database, which the extract's
      # README says why.
      - name: Valhalla — build tiles from the extract
        if: steps.scope.outputs.routing == 'true'
        run: |
          data="$RUNNER_TEMP/valhalla"
          mkdir -p "$data"
          cp "$EXTRACT" "$data/extract.osm.pbf"
          start=$SECONDS
          docker pull --quiet "$VALHALLA_IMAGE"
          pulled=$((SECONDS - start))
          start=$SECONDS
          docker run --rm -v "$data:/data" "$VALHALLA_IMAGE" sh -c '
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar \
              --mjolnir-traffic-extract "" --mjolnir-admin /data/admins.sqlite --mjolnir-timezone /data/tz.sqlite \
              > /data/valhalla.json &&
            valhalla_build_tiles -c /data/valhalla.json /data/extract.osm.pbf'
          built=$((SECONDS - start))
          echo "image pulled in ${pulled}s, tiles built in ${built}s"
          echo "Valhalla: image pulled in ${pulled}s, tiles built in ${built}s" >> "$GITHUB_STEP_SUMMARY"

      # Bound to the runner's loopback only, and ready when /status answers.
      - name: Valhalla — serve
        if: steps.scope.outputs.routing == 'true'
        run: |
          docker run -d --name valhalla -p 127.0.0.1:8002:8002 -v "$RUNNER_TEMP/valhalla:/data" \
            "$VALHALLA_IMAGE" valhalla_service /data/valhalla.json 1
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8002/status; then echo; exit 0; fi
            sleep 1
          done
          echo '::error::Valhalla did not answer /status within 60 s'
          docker logs valhalla
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.routing == 'true'
        with:
          go-version-file: service/go.mod
          cache-dependency-path: |
            service/go.mod
            service/go.sum

      # go test's exit status is the step's (the job's shell runs with
      # pipefail). The tagged file fails rather than skips without an engine,
      # and a skip anywhere in the run is red too.
      - name: Go tests against Valhalla
        if: steps.scope.outputs.routing == 'true'
        run: |
          cd service
          go vet -tags valhalla ./internal/valhalla
          log="$RUNNER_TEMP/valhalla-tests.log"
          TURFGPS_TEST_VALHALLA_URL=http://127.0.0.1:8002 \
            go test -tags valhalla -race -count=1 -v ./internal/valhalla 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then echo '::error::a test skipped against Valhalla, so it measured nothing'; exit 1; fi

      - name: Valhalla logs
        if: always() && steps.scope.outputs.routing == 'true'
        run: docker logs valhalla 2>&1 || true
